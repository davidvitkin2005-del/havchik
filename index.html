<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#161618">
<title>Хавчик</title>
<meta name="description" content="49 мест в Москве, где вкусно поесть: фильтры по кухне и времени, рандомайзер из открытых сейчас.">
<meta property="og:title" content="Хавчик">
<meta property="og:description" content="Куда пойти поесть в Москве прямо сейчас">
<meta property="og:image" content="cover-1080.jpg">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://avatars.mds.yandex.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap">
<style>
/* Тёмная обложка с фото целиком: при прокрутке оно уходит с параллаксом, при наклоне телефона
   слегка поворачивается и бликует. Ниже «выезжает» лист с жёлтой табличкой-рандомайзером,
   фильтрами-чипсами и карточками мест. Карточка места открывается шторкой на весь экран. */
:root {
  --bg: #F2F1EE;
  --surface: #FFFFFF;
  --surface-2: #ECEAE5;
  --ink: #141414;
  --ink-2: #4B4A46;
  --muted: #7B7973;
  --line: #E0DED8;
  --night: #161618;          /* фон обложки, совпадает с чёрным фоном фото */
  --night-ink: #FFFFFF;
  --cheese: #FFC21A;         /* табличка рандомайзера */
  --cheese-ink: #151515;
  --ketchup: #E5341D;        /* главная кнопка */
  --ketchup-ink: #FFFFFF;
  --chip-on: #151515;
  --chip-on-ink: #FFFFFF;
  --open: #1B9447;
  --soon: #C9730B;
  --closed: #8D8B85;
  --pill-bg: rgba(255, 255, 255, 0.94);
  --pill-ink: #141414;
  --on-photo: #FFFFFF;
  --shadow: 0 1px 2px rgba(20, 20, 20, 0.06), 0 12px 26px -16px rgba(20, 20, 20, 0.35);
  --f-display: "Unbounded", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F0F10; --surface: #1A1A1C; --surface-2: #232326; --ink: #F3F2EF; --ink-2: #C3C1BB;
    --muted: #8F8D87; --line: #2D2D30; --night: #161618; --night-ink: #FFFFFF; --cheese: #FFC21A;
    --cheese-ink: #151515; --ketchup: #F0412A; --ketchup-ink: #FFFFFF; --chip-on: #FFC21A; --chip-on-ink: #151515;
    --open: #4CD07D; --soon: #F2B144; --closed: #85837D;
    --pill-bg: rgba(15, 15, 16, 0.82); --pill-ink: #F3F2EF; --on-photo: #FFFFFF;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 14px 30px -18px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F0F10; --surface: #1A1A1C; --surface-2: #232326; --ink: #F3F2EF; --ink-2: #C3C1BB;
  --muted: #8F8D87; --line: #2D2D30; --night: #161618; --night-ink: #FFFFFF; --cheese: #FFC21A;
  --cheese-ink: #151515; --ketchup: #F0412A; --ketchup-ink: #FFFFFF; --chip-on: #FFC21A; --chip-on-ink: #151515;
  --open: #4CD07D; --soon: #F2B144; --closed: #85837D;
  --pill-bg: rgba(15, 15, 16, 0.82); --pill-ink: #F3F2EF; --on-photo: #FFFFFF;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 14px 30px -18px rgba(0, 0, 0, 0.8);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--night); }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--night);
  color: var(--ink);
  font: 400 15px/1.45 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
html.is-locked, html.is-locked body { overflow: hidden; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }

/* ---------- Обложка на весь экран ----------
   Фото привязано к верху: головы не срезаются никогда. По ширине оно приближается
   максимум в 1,18 раза, чтобы лица по бокам тоже оставались в кадре (лица занимают
   примерно 14–90% ширины снимка). Что не влезло по высоте, уходит вниз, под табличку. */
.hero {
  --hh: 100vh;
  --img-top: calc(24px + env(safe-area-inset-top, 0px));
  position: relative;
  overflow: hidden;
  height: max(540px, var(--hh));
  background: var(--night);
  color: var(--night-ink);
  perspective: 1100px;
}
@supports (height: 100svh) { .hero { --hh: 100svh; } }
html[data-tg] .hero { --hh: var(--tg-viewport-stable-height, 100svh); }
.hero-media {
  position: absolute;
  top: var(--img-top);
  left: 50%;
  width: clamp(min(100%, 720px), calc((max(540px, var(--hh)) - var(--img-top)) * 0.8), min(118%, 760px));
  aspect-ratio: 1080 / 1350;
  transform: translateX(-51.5%) scale(1.04);
  transform-origin: 51.5% 0;
  will-change: transform;
}
.hero-media picture, .hero-media img { display: block; width: 100%; height: 100%; }
.hero-media img {
  object-fit: cover;
  object-position: 50% 0;
  transform-origin: 50% 0;
  animation: hero-in 1.3s cubic-bezier(.2, .7, .2, 1) both;
}
@media (min-width: 721px) {
  .hero-media img {
    -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
  }
}
@keyframes hero-in { from { transform: scale(1.05); opacity: 0; } to { transform: none; opacity: 1; } }
.hero-glare {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at var(--gx, 50%) var(--gy, 30%), rgba(255, 214, 120, 0.26), rgba(255, 214, 120, 0) 46%);
  mix-blend-mode: screen;
  opacity: var(--go, 0.35);
}
.hero-fade {
  position: absolute;
  inset: auto 0 0 0;
  height: 30%;
  pointer-events: none;
  background: linear-gradient(to top, var(--night) 22%, rgba(22, 22, 24, 0.82) 52%, rgba(22, 22, 24, 0));
}
.hero-top {
  position: absolute;
  inset: 0 0 auto 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 0;
  will-change: transform, opacity;
}
.logo {
  font: 800 28px/1 var(--f-display);
  letter-spacing: -0.02em;
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
  animation: rise 0.9s 0.2s cubic-bezier(.2, .7, .2, 1) both;
}
.logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--cheese); flex: none; }
.clock {
  font: 600 10px/1.2 var(--f-body);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-align: right;
  font-variant-numeric: tabular-nums;
  opacity: 0.85;
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
  animation: rise 0.9s 0.3s cubic-bezier(.2, .7, .2, 1) both;
}
.clock b { display: block; font-size: 15px; letter-spacing: 0.02em; opacity: 1; }
.hero-bottom {
  position: absolute;
  inset: auto 0 0 0;
  z-index: 2;
  max-width: 760px;
  margin: 0 auto;
  padding: 0 16px 46px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.tagline {
  margin: 0 2px;
  font: 600 15px/1.35 var(--f-body);
  text-wrap: balance;
  text-shadow: 0 1px 12px rgba(0, 0, 0, 0.6);
  animation: rise 0.9s 0.35s cubic-bezier(.2, .7, .2, 1) both;
}
.tagline span { display: block; font-weight: 400; font-size: 13px; opacity: 0.75; }

/* ---------- Лист с контентом ---------- */
.app {
  position: relative;
  z-index: 2;
  margin-top: -26px;
  background: var(--bg);
  border-radius: 26px 26px 0 0;
  min-height: 60vh;
}
.app-inner {
  max-width: 760px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 18px 36px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* Табличка-рандомайзер */
.sign {
  all: unset;
  box-sizing: border-box;
  cursor: pointer;
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 14px;
  row-gap: 4px;
  padding: 18px 16px 17px 18px;
  border-radius: 18px;
  background: var(--cheese);
  color: var(--cheese-ink);
  box-shadow: 0 18px 34px -18px rgba(0, 0, 0, 0.55);
  transition: transform 0.15s ease;
}
.sign:active { transform: scale(0.985); }
.sign:focus-visible { outline: 3px solid var(--ketchup); outline-offset: 3px; }
.sign-eyebrow { font: 700 11px/1 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }
.sign-title { font: 700 21px/1.15 var(--f-display); letter-spacing: -0.01em; }
.sign-sub { font-size: 13px; opacity: 0.78; }
.die { grid-column: 2; grid-row: 1 / span 3; width: 54px; height: 54px; display: block; }
.die rect { fill: var(--cheese-ink); }
.die circle { fill: var(--cheese); }
.sign.is-rolling .die { animation: roll 0.7s cubic-bezier(.3, .7, .3, 1); }
@keyframes roll { 0% { transform: rotate(0) scale(1); } 45% { transform: rotate(200deg) scale(0.84); } 100% { transform: rotate(360deg) scale(1); } }

/* Поиск и фильтры */
.search {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 46px;
  padding: 0 14px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--muted);
}
.search:focus-within { border-color: var(--ink); }
.search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font: 400 16px/1 var(--f-body);
  -webkit-appearance: none;
  appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search svg { flex: none; }

.filter { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.filter-label { font: 600 11px/1 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.chips {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  margin-inline: -16px;
  padding-inline: 16px;
  padding-block: 2px;
  scroll-padding-inline: 16px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  cursor: pointer;
  height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font: 500 14px/1 var(--f-body);
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-variant-numeric: tabular-nums;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.chip .n { color: var(--muted); font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--chip-on); border-color: var(--chip-on); color: var(--chip-on-ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: 0.7; }
.chip:focus-visible { outline: 2px solid var(--ketchup); outline-offset: 2px; }
.chip-sep { flex: none; font: 600 11px/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-inline: 2px; }

/* Список */
.list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--ink-2); font-size: 13px; }
.link-btn { border: 0; background: none; padding: 0; color: var(--ketchup); font-weight: 600; font-size: 13px; cursor: pointer; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 640px) { .list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.group-title {
  grid-column: 1 / -1;
  margin: 10px 0 -2px;
  font: 600 11px/1 var(--f-body);
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}
.group-title:first-child { margin-top: 0; }

.card {
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  border: 0;
  padding: 0;
  transition: transform 0.15s ease;
}
.card:active { transform: scale(0.99); }
.card:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.card.is-closed .media img { filter: saturate(0.5) brightness(0.92); }

.media { position: relative; display: block; aspect-ratio: 16 / 10; background: var(--surface-2); overflow: hidden; }
.media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.ph {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 800 54px/1 var(--f-display);
  color: var(--line);
}
.pill {
  position: absolute;
  left: 10px;
  top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: calc(100% - 84px);
  padding: 6px 10px 6px 9px;
  border-radius: 999px;
  background: var(--pill-bg);
  color: var(--pill-ink);
  font: 600 12px/1 var(--f-body);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--closed); }
.tone-open .dot { background: var(--open); }
.tone-soon .dot { background: var(--soon); }
.tone-closed .dot { background: var(--closed); }
.rating {
  position: absolute;
  right: 10px;
  top: 10px;
  padding: 6px 9px;
  border-radius: 999px;
  background: var(--pill-bg);
  color: var(--pill-ink);
  font: 600 12px/1 var(--f-body);
  font-variant-numeric: tabular-nums;
}

.card-body { padding: 12px 14px 15px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card-name { margin: 0; font: 600 18px/1.2 var(--f-body); text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 10px; color: var(--ink-2); font-size: 13px; }
.metro { display: inline-flex; align-items: center; gap: 5px; }
.metro i { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c, var(--muted)); }
.metro i + i { margin-left: -8px; box-shadow: 0 0 0 1.5px var(--surface); }
.muted { color: var(--muted); }
.desc {
  margin: 0;
  color: var(--ink-2);
  font-size: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.today { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.tag { padding: 5px 8px; border-radius: 7px; background: var(--surface-2); color: var(--ink-2); font: 500 12px/1.1 var(--f-body); }

.empty {
  grid-column: 1 / -1;
  padding: 28px 18px;
  border-radius: 18px;
  border: 1px dashed var(--line);
  text-align: center;
  color: var(--ink-2);
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.empty b { color: var(--ink); font-size: 16px; }
.foot { margin: 6px 0 0; color: var(--muted); font-size: 12px; text-align: center; text-wrap: balance; }

/* ---------- Шторка с местом ---------- */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: var(--bg);
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  transform: translateY(100%);
  visibility: hidden;
  transition: transform 0.34s cubic-bezier(.2, .8, .2, 1), visibility 0s linear 0.34s;
}
.sheet.is-open { transform: none; visibility: visible; transition: transform 0.34s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
.sheet:focus { outline: none; }
.sheet-inner { max-width: 760px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

.close {
  position: absolute;
  top: calc(12px + env(safe-area-inset-top, 0px));
  right: 12px;
  z-index: 3;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 0;
  display: grid;
  place-items: center;
  background: var(--pill-bg);
  color: var(--pill-ink);
  cursor: pointer;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.close:focus-visible { outline: 2px solid var(--ketchup); outline-offset: 2px; }

.gallery { position: relative; background: var(--surface-2); }
.track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.shot { flex: 0 0 100%; aspect-ratio: 4 / 3; max-height: 56vh; width: 100%; scroll-snap-align: center; position: relative; overflow: hidden; }
.shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery > .ph { position: relative; aspect-ratio: 16 / 9; }
.dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--on-photo); opacity: 0.5; transition: opacity 0.2s, transform 0.2s; }
.dots i.on { opacity: 1; transform: scale(1.25); }

.reveal {
  position: relative;
  background: var(--cheese);
  color: var(--cheese-ink);
  padding: calc(28px + env(safe-area-inset-top, 0px)) 18px 22px;
}
.reveal-eyebrow { font: 700 11px/1 var(--f-body); letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }
.reveal-name { margin: 10px 0 0; font: 700 26px/1.15 var(--f-display); letter-spacing: -0.01em; min-height: 2.3em; display: flex; align-items: flex-end; text-wrap: balance; }
.reveal-sub { margin-top: 6px; font-size: 13px; opacity: 0.75; min-height: 1.2em; }

.sheet-body { padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 18px; flex: 1; }
.is-hidden-until-reveal { opacity: 0; transform: translateY(8px); transition: opacity 0.35s ease, transform 0.35s ease; }
.is-revealed .is-hidden-until-reveal { opacity: 1; transform: none; }
.title { margin: 0; font: 700 25px/1.15 var(--f-display); letter-spacing: -0.01em; text-wrap: balance; }
.status-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
.status-line .muted { font-weight: 400; }
.facts { display: flex; flex-direction: column; gap: 10px; }
.fact { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; align-items: start; color: var(--ink-2); }
.fact svg { color: var(--muted); margin-top: 2px; }
.fact .meta { margin-top: 4px; }
.lead { margin: 0; font-size: 16px; line-height: 1.55; color: var(--ink); max-width: 62ch; }
.section-h { margin: 0 0 10px; font: 600 11px/1 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.note { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
.reels { display: flex; flex-wrap: wrap; gap: 8px; }
.reel-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font: 500 14px/1 var(--f-body);
  text-decoration: none;
}
.reel-link svg { color: var(--ketchup); }
.reel-link:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.perks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.perks li { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 9px; align-items: start; }
.perks svg { color: var(--ketchup); margin-top: 3px; }
.hours { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 18px; margin: 0; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.hours dt, .hours dd { margin: 0; }
.hours .is-today { color: var(--ink); font-weight: 700; }

.actions {
  position: sticky;
  bottom: 0;

}

.soonest { display: flex; flex-direction: column; gap: 10px; }
.mini {

.mini .thumb { width: 56px; height: 56px; border-radius: 10px; overflow: hidden; background: var(--surface-2); position: relative; }

          return '<a class="reel-link" href="https://www.instagram.com/p/' + esc(code) + '/" target="_blank" rel="noopener" data-external>' +
            ICON.play + (p.reels.length > 1 ? 'Рилс ' + (i + 1) : 'Смотреть рилс') + '</a>';
        }).join('') + '</div><p class="note">Рилсы из чата «Места Москва», откроются в Instagram.</p></section>' : '');
  }

  function actionsHTML(p, mode) {
    var maps = '<a class="btn btn-primary" href="' + esc(p.yandex) + '" target="_blank" rel="noopener" data-external>' + ICON.map + 'Яндекс Карты</a>';
    if (mode === 'random') {
      return '<div class="actions"><button class="btn btn-secondary" type="button" data-action="respin">' + ICON.dice + 'Ещё</button>' + maps + '</div>';
    }
    return '<div class="actions">' + maps + '</div>';
  }

  function openSheet(html) {
    var sheet = $('#sheet');
    $('#sheetContent').innerHTML = html;
    sheet.scrollTop = 0;
    if (!sheet.classList.contains('is-open')) {
      sheet.classList.add('is-open');
      document.documentElement.classList.add('is-locked');
      sheet.setAttribute('aria-hidden', 'false');
      if (inTG) { try { tg.BackButton.show(); } catch (e) { /* ок */ } }
    }
    try { sheet.focus({ preventScroll: true }); } catch (e) { sheet.focus(); }
    bindGallery();
  }

  function closeSheet() {
    var sheet = $('#sheet');
    if (!sheet.classList.contains('is-open')) return;
    spinTimers.forEach(clearTimeout);
    spinTimers = [];
    sheet.classList.remove('is-open');
    sheet.setAttribute('aria-hidden', 'true');
    document.documentElement.classList.remove('is-locked');
    sheetPlace = null;
    if (inTG) { try { tg.BackButton.hide(); } catch (e) { /* ок */ } }
  }

  function bindGallery() {
    var track = $('#track');
    if (!track) return;
    var dots = document.querySelectorAll('.dots i');
    track.addEventListener('scroll', function () {
      var i = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
      for (var k = 0; k < dots.length; k++) dots[k].classList.toggle('on', k === i);
    }, { passive: true });
  }

  function showPlace(id) {
    var p = byId[id];
    if (!p) return;
    sheetPlace = p;
    var now = T.mskNow();
    haptic('impactOccurred', 'light');
    openSheet('<div class="sheet-inner">' +
      '<div style="position:relative">' + galleryHTML(p) +
        '<button class="close" type="button" data-action="close" aria-label="Закрыть">' + ICON.close + '</button></div>' +
      '<div class="sheet-body">' + detailBodyHTML(p, now, { withTitle: true }) + '</div>' +
      actionsHTML(p, 'detail') + '</div>');
  }

  /* ---------- Рандомайзер ---------- */
  function spin(ignoreCuisine) {
    var now = T.mskNow();
    var tNow = T.absNow(now);
    var pool = spinPool(tNow, ignoreCuisine);
    var btn = $('#spin');
    btn.classList.remove('is-rolling');
    void btn.offsetWidth;
    btn.classList.add('is-rolling');
    haptic('impactOccurred', 'medium');

    if (!pool.length) {
      showNothingOpen(now, tNow, !ignoreCuisine && selectedCuisines().length > 0 && spinPool(tNow, true).length > 0);
      return;
    }
    var choices = pool.length > 1 && lastPick ? pool.filter(function (p) { return p.id !== lastPick; }) : pool;
    var pick = choices[Math.floor(Math.random() * choices.length)];
    lastPick = pick.id;
    sheetPlace = pick;

    openSheet('<div class="sheet-inner" id="randomSheet">' +
      '<div class="reveal is-spinning" id="reveal">' +
        '<button class="close" type="button" data-action="close" aria-label="Закрыть">' + ICON.close + '</button>' +
        '<div class="reveal-eyebrow">Следующая станция</div>' +
        '<div class="reveal-name" id="sheetTitle" aria-live="polite">' + esc(pool[Math.floor(Math.random() * pool.length)].name) + '</div>' +
        '<div class="reveal-sub" id="revealSub">Выбираю из ' + pool.length + ' ' + plural(pool.length, 'места', 'мест', 'мест') + '…</div>' +
      '</div>' +
      '<div class="is-hidden-until-reveal">' + galleryHTML(pick) + '</div>' +
      '<div class="sheet-body is-hidden-until-reveal">' + detailBodyHTML(pick, now, { withTitle: false }) + '</div>' +
      '<div class="is-hidden-until-reveal">' + actionsHTML(pick, 'random') + '</div>' +
    '</div>');

    var nameEl = $('#reveal .reveal-name');
    var finish = function () {
      nameEl.textContent = pick.name;
      $('#reveal').classList.remove('is-spinning');
      $('#revealSub').textContent = [pick.cuisine && pick.cuisine.join(', '), pick.metro && pick.metro[0] && ('м. ' + pick.metro[0].name)].filter(Boolean).join(' · ');
      $('#randomSheet').classList.add('is-revealed');
      haptic('notificationOccurred', 'success');
    };
    if (reduceMotion || pool.length === 1) { finish(); return; }
    var delays = [60, 60, 70, 80, 90, 110, 130, 160, 200, 250, 320];
    var acc = 0;
    var names = pool.map(function (p) { return p.name; });
    var prev = -1;
    delays.forEach(function (d) {
      acc += d;
      spinTimers.push(setTimeout(function () {
        var i;
        do { i = Math.floor(Math.random() * names.length); } while (names.length > 1 && i === prev);
        prev = i;
        nameEl.textContent = names[i];
        haptic('selectionChanged');
      }, acc));
    });
    spinTimers.push(setTimeout(finish, acc + 380));
  }

  function showNothingOpen(now, tNow, cuisineOnly) {
    var soon = places.filter(function (p) { return cuisineOnly ? cuisineOk(p) : true; })
      .map(function (p) { return { p: p, st: T.statusAtAbs(p._s, tNow) }; })
      .filter(function (x) { return !x.st.open && !x.st.never; })
      .sort(function (a, b) { return a.st.until - b.st.until; })
      .slice(0, 4);
    var list = soon.map(function (x) {
      var photo = (x.p.photos || [])[0];
      return '<button class="mini" type="button" data-id="' + esc(x.p.id) + '"><span class="thumb">' + placeholderHTML(x.p) +
        (photo ? '<img src="' + esc(photoUrl(photo, 'M')) + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '') + '</span>' +
        '<span><b>' + esc(x.p.name) + '</b><span>' + esc(T.statusLabel(x.st).text) + '</span></span></button>';
    }).join('');
    openSheet('<div class="sheet-inner is-revealed">' +
      '<div class="reveal"><button class="close" type="button" data-action="close" aria-label="Закрыть">' + ICON.close + '</button>' +
        '<div class="reveal-eyebrow">' + (cuisineOnly ? 'Эта кухня спит' : 'Москва спит') + '</div>' +
        '<div class="reveal-name" id="sheetTitle">' + (cuisineOnly ? 'Из выбранного сейчас всё закрыто' : 'Сейчас всё закрыто') + '</div>' +
        '<div class="reveal-sub">Раньше всех откроются эти места</div></div>' +
      '<div class="sheet-body"><div class="soonest">' + list + '</div>' +
        (cuisineOnly ? '<button class="btn btn-primary" type="button" data-action="spin-all">' + ICON.dice + 'Крутить среди всех</button>' : '') +
      '</div></div>');
  }

  /* ---------- События ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    var ext = t.closest && t.closest('a[data-external]');
    if (ext && inTG && tg.openLink) {
      e.preventDefault();
      try { tg.openLink(ext.href); } catch (err) { window.open(ext.href, '_blank'); }
      return;
    }
    var act = t.closest && t.closest('[data-action]');
    if (act) {
      var a = act.getAttribute('data-action');
      if (a === 'close') closeSheet();
      else if (a === 'respin') spin();
      else if (a === 'spin-all') spin(true);
      else if (a === 'reset') resetFilters();
      return;
    }
    var card = t.closest && t.closest('[data-id]');
    if (card) { showPlace(card.getAttribute('data-id')); return; }
    var chip = t.closest && t.closest('.chip');
    if (chip) {
      haptic('selectionChanged');
      if (chip.hasAttribute('data-cuisine')) {
        var c = chip.getAttribute('data-cuisine');
        if (!c) state.cuisines = {};
        else if (state.cuisines[c]) delete state.cuisines[c];
        else state.cuisines[c] = true;
      } else if (chip.hasAttribute('data-when')) {
        var w = chip.getAttribute('data-when');
        state.when = (w === 'any' || w === 'now') ? w : Number(w);
      }
      render();
    }
  });

  $('#spin').addEventListener('click', function () { spin(); });
  $('#reset').addEventListener('click', resetFilters);
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'IMG') e.target.remove();
  }, true);

  function resetFilters() {
    state.cuisines = {};
    state.when = 'any';
    state.q = '';
    $('#q').value = '';
    render();
  }

  /* ---------- Обложка: параллакс при прокрутке и наклон телефона ---------- */
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  var hero = $('#hero');
  var heroMedia = $('#heroMedia');
  var heroGlare = $('#heroGlare');
  var heroTop = $('#heroTop');
  var motion = { tx: 0, ty: 0, cx: 0, cy: 0, scroll: 0, h: hero ? hero.offsetHeight : 600, raf: 0, b0: null, g0: null, tgOn: false };

  function heroFrame() {
    motion.raf = 0;
    motion.cx += (motion.tx - motion.cx) * 0.12;
    motion.cy += (motion.ty - motion.cy) * 0.12;
    var s = Math.min(motion.scroll, motion.h);
    var k = s / motion.h;
    // translateX(-51.5%) держит середину между лицами по центру экрана; scale(1.04) с опорой
    // на верхний край даёт запас по бокам для наклона, а верх снимка остаётся на месте
    heroMedia.style.transform =
      'translateX(-51.5%) translate3d(' + (motion.cx * 6).toFixed(2) + 'px,' + (s * 0.34 + motion.cy * 5).toFixed(2) + 'px,0)' +
      ' rotateX(' + (-motion.cy * 4).toFixed(2) + 'deg) rotateY(' + (motion.cx * 5).toFixed(2) + 'deg) scale(1.04)';
    heroGlare.style.setProperty('--gx', (50 + motion.cx * 34).toFixed(1) + '%');
    heroGlare.style.setProperty('--gy', (32 + motion.cy * 28).toFixed(1) + '%');
    heroGlare.style.setProperty('--go', (0.3 + Math.min(1, Math.sqrt(motion.cx * motion.cx + motion.cy * motion.cy)) * 0.7).toFixed(3));
    if (heroTop) {
      heroTop.style.transform = 'translate3d(' + (-motion.cx * 3).toFixed(2) + 'px,' + (s * 0.18).toFixed(2) + 'px,0)';
      heroTop.style.opacity = String(clamp(1 - k * 1.6, 0, 1).toFixed(3));
    }
    if (Math.abs(motion.tx - motion.cx) > 0.003 || Math.abs(motion.ty - motion.cy) > 0.003) heroSchedule();
  }
  function heroSchedule() { if (!motion.raf) motion.raf = requestAnimationFrame(heroFrame); }

  function heroTilt(betaDeg, gammaDeg) {
    if (motion.b0 === null) { motion.b0 = betaDeg; motion.g0 = gammaDeg; }
    motion.b0 += (betaDeg - motion.b0) * 0.004;   // медленно подстраиваемся под то, как держат телефон
    motion.g0 += (gammaDeg - motion.g0) * 0.004;
    motion.tx = clamp((gammaDeg - motion.g0) / 18, -1, 1);
    motion.ty = clamp((betaDeg - motion.b0) / 18, -1, 1);
    heroSchedule();
  }

  function tgOrientation(on) {
    if (!inTG || !tg.DeviceOrientation || !(tg.isVersionAtLeast && tg.isVersionAtLeast('8.0'))) return;
    if (on === motion.tgOn) return;
    motion.tgOn = on;
    try { if (on) tg.DeviceOrientation.start({ refresh_rate: 40 }); else tg.DeviceOrientation.stop(); } catch (e) { /* ок */ }
  }

  if (hero && heroMedia && !reduceMotion) {
    window.addEventListener('scroll', function () {
      motion.scroll = window.scrollY || window.pageYOffset || 0;
      tgOrientation(motion.scroll < motion.h);
      heroSchedule();
    }, { passive: true });
    window.addEventListener('resize', function () { motion.h = hero.offsetHeight || motion.h; heroSchedule(); });

    if (inTG && tg.DeviceOrientation && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0')) {
      try {
        tg.onEvent('deviceOrientationChanged', function () {
          var d = tg.DeviceOrientation;
          heroTilt((d.beta || 0) * 57.2958, (d.gamma || 0) * 57.2958);
        });
      } catch (e) { /* ок */ }
      tgOrientation(true);
    } else if ('DeviceOrientationEvent' in window) {
      window.addEventListener('deviceorientation', function (e) {
        if (e.beta == null || e.gamma == null) return;
        heroTilt(e.beta, e.gamma);
      });
    }
    hero.addEventListener('pointermove', function (e) {
      if (e.pointerType !== 'mouse') return;
      var r = hero.getBoundingClientRect();
      motion.tx = clamp(((e.clientX - r.left) / r.width - 0.5) * 1.6, -1, 1);
      motion.ty = clamp(((e.clientY - r.top) / r.height - 0.5) * 1.6, -1, 1);
      heroSchedule();
    });
    hero.addEventListener('pointerleave', function () { motion.tx = 0; motion.ty = 0; heroSchedule(); });
    heroSchedule();
  }

  renderTagline();
  render();
  setInterval(function () {
    render();
    if (sheetPlace && $('#sheet').classList.contains('is-open') && !$('#reveal')) {
      var line = $('#sheet .status-line');
      if (line) {
        var now = T.mskNow();
        var lab = T.statusLabel(T.statusAtAbs(sheetPlace._s, T.absNow(now)));
        line.className = 'status-line tone-' + lab.tone;
        line.children[1].textContent = lab.text;
      }
    }
  }, 30000);
})();

</script>
</body>
</html>
