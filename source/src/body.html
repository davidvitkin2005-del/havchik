<header class="hero" id="hero">
  <div class="hero-media" id="heroMedia">
    <picture>
      <source type="image/webp" srcset="cover-720.webp 720w, cover-1080.webp 1080w" sizes="(min-width: 700px) 760px, 118vw">
      <img src="cover-1080.jpg" srcset="cover-720.jpg 720w, cover-1080.jpg 1080w" sizes="(min-width: 700px) 760px, 118vw" alt="Двое тянутся к огромному бургеру" width="1080" height="1350" fetchpriority="high" decoding="async">
    </picture>
    <div class="hero-glare" id="heroGlare"></div>
  </div>
  <div class="hero-fade" aria-hidden="true"></div>
  <div class="hero-top" id="heroTop">
    <div class="logo">хавчик<span class="logo-dot" aria-hidden="true"></span></div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="hero-bottom">
    <p class="tagline" id="tagline"></p>
    <button class="sign" id="spin" type="button">
      <span class="sign-eyebrow">Рандомайзер</span>
      <span class="sign-title">Куда пойти сейчас?</span>
      <span class="sign-sub" id="spinSub"></span>
      <svg class="die" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="3" y="3" width="42" height="42" rx="11"></rect>
        <circle cx="14.5" cy="14.5" r="3.6"></circle><circle cx="33.5" cy="14.5" r="3.6"></circle>
        <circle cx="24" cy="24" r="3.6"></circle>
        <circle cx="14.5" cy="33.5" r="3.6"></circle><circle cx="33.5" cy="33.5" r="3.6"></circle>
      </svg>
    </button>
  </div>
</header>

<div class="app">
  <div class="app-inner">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Название, метро или кухня" autocomplete="off" enterkeyhint="search" aria-label="Поиск по местам">
    </label>

    <section class="filter" aria-label="Кухня">
      <div class="filter-label">Кухня</div>
      <div class="chips" id="cuisineChips"></div>
    </section>

    <section class="filter" aria-label="Время работы">
      <div class="filter-label">Открыто</div>
      <div class="chips" id="timeChips"></div>
    </section>

    <section class="map-section" aria-label="Карта мест">
      <div class="map-head">
        <div class="filter-label">На карте</div>
        <span class="map-count" id="mapCount"></span>
      </div>
      <div class="map-card" id="mapCard">
        <div class="ymap" id="ymap"></div>
        <div class="map-state" id="mapLoading">Загружаю карту…</div>
        <div class="map-state" id="mapFallback" hidden>Карта Яндекса откроется в приложении в Telegram</div>
        <button class="map-full-btn" id="mapFullBtn" type="button" data-action="map-full" aria-label="Развернуть карту"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Развернуть</span></button>
        <div class="map-peek" id="mapPeek" hidden></div>
      </div>
    </section>

    <div class="list-head">
      <span id="count"></span>
      <button class="link-btn" id="reset" type="button" hidden>Сбросить фильтры</button>
    </div>

    <main class="list" id="list"></main>

    <p class="foot">Часы работы, адреса и фото взяты из Яндекс Карт, фишки из рилсов в чате «Места Москва». Перед выходом лучше открыть место на карте и проверить.</p>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" tabindex="-1">
  <div id="sheetContent"></div>
</div>
